<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- TikTok Embed Script -->
    <script async src="https://www.tiktok.com/embed.js"></script>

    <style>
        :root {
            /* PAYBACK Color Tokens (Red/Blue Swapped) */
            --bg-dark: #05070A;
            --card-bg: rgba(23, 26, 31, 0.88);
            --card-border: #2A3038;
            --crimson: #0069B1;                      /* Swapped: Electric Blue */
            --crimson-glow: rgba(0, 105, 177, 0.3);  /* Swapped: Blue Glow */
            --electric-blue: #8B0000;                 /* Swapped: Crimson Red */
            --blue-glow: rgba(139, 0, 0, 0.35);       /* Swapped: Crimson Glow */
            --bunny-pink: #FFC0CB;
            --pink-glow: rgba(255, 192, 203, 0.25);
            --text-main: #E2E8F0;
            --text-sub: #94A3B8;

            /* Poster Accurate Typography Tokens */
            --font-display: 'Montserrat', 'Arial Black', sans-serif;
            --font-body: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('background_no_title.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* FULL-WIDTH SEAMLESS HEADER */
        .full-width-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .full-width-header img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* CENTERED CONTENT WRAPPER */
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }

        /* MAIN ROUTINE TABS */
        .tab-navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 14px 24px;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 450px;
        }

        .tab-btn:hover {
            color: var(--bunny-pink);
            border-color: var(--pink-glow);
            box-shadow: 0 0 12px var(--pink-glow);
            background: var(--pink-glow);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(54, 10, 10, 0.95) 0%, var(--card-bg) 100%);
            color: var(--text-main);
            border-color: var(--electric-blue);
            box-shadow: 0 0 15px var(--blue-glow);
        }

        /* DAY SELECTOR TABS */
        .day-nav {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .day-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 10px 16px;
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            flex: 1;
            text-align: center;
            transition: all 0.2s ease;
        }

        .day-btn:hover {
            border-color: var(--pink-glow);
            color: var(--bunny-pink);
            box-shadow: 0 0 10px var(--pink-glow);
        }

        .day-btn.active {
            background: linear-gradient(135deg, rgba(54, 10, 10, 0.95) 0%, var(--card-bg) 100%);
            color: var(--text-main);
            border-color: var(--electric-blue);
            box-shadow: 0 0 12px var(--blue-glow);
        }

        /* CONTENT DISPLAY & GRID */
        .routine-content { display: none; }
        .routine-content.active { display: block; }
        
        .day-content { display: none; }
        .day-content.active { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
            align-items: start;
        }

        @media (min-width: 850px) {
            .day-content.active {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* WORKOUT CARD LAYOUT */
        .exercise-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--electric-blue);
            border-radius: 8px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
        }

        .exercise-card.full-width {
            grid-column: 1 / -1;
            flex-direction: column;
        }

        .exercise-card:hover {
            border-color: var(--pink-glow);
            border-left-color: var(--bunny-pink);
        }

        .exercise-info { 
            flex: 1; 
            position: relative;
        }

        .block-tag {
            display: inline-block;
            background: var(--blue-glow);
            color: var(--electric-blue);
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 4px 8px;
            border: 2px solid var(--blue-glow);
            border-radius: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .block-tag.warmup, .block-tag.finisher {
            background: var(--blue-glow);
            color: var(--electric-blue);
            border: 1px solid var(--blue-glow);
        }

        .exercise-title {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
            transition: color 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .exercise-title::after {
            content: '▼';
            font-size: 0.75rem;
            color: var(--text-sub);
            transition: transform 0.25s ease;
            margin-left: 10px;
        }

        .exercise-card.expanded .exercise-title::after {
            transform: rotate(180deg);
            color: var(--bunny-pink);
        }

        .exercise-meta {
            color: var(--electric-blue);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
            transition: color 0.25s ease;
        }

        .exercise-notes {
            color: var(--text-sub);
            font-size: 0.85rem;
            font-style: italic;
        }

        /* TIKTOK EMBED DISPLAY CONTAINER */
        .media-container {
            width: 100%;
            max-width: 320px;
            min-height: 480px;
            background-color: #000;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            display: none; /* Collapsed state */
            align-items: center;
            justify-content: center;
            align-self: center;
            flex-shrink: 0;
            position: relative;
            margin-top: 15px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .exercise-card.expanded .media-container {
            display: flex; /* Expanded state */
        }

        /* Adjustments for embedded iframe/blockquote scale */
        .media-container blockquote.tiktok-embed {
            margin: 0 !important;
            padding: 0 !important;
            max-width: 100% !important;
            min-width: 280px !important;
            width: 100% !important;
        }

        .tiktok-placeholder {
            color: var(--text-sub);
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header class="full-width-header">
        <img src="header.png" alt="WORKOUT FOR THE CUT">
    </header>

    <main class="app-container">
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="switchRoutine('routineA', this)">
                SUN<br><small style="font-size:0.7rem; color: var(--text-sub);">[Two Baht Routine]</small>
            </button>
            <button class="tab-btn" onclick="switchRoutine('routineB', this)">
                JAY<br><small style="font-size:0.7rem; color: var(--text-sub);">[Three Baht Routine]</small>
            </button>
        </div>

        <div id="routineA" class="routine-content active">
            <div class="day-nav">
                <button class="day-btn active" onclick="switchDay('rA', 'day1', this)">DAY 1: LOWER (GLUTE/HAM)</button>
                <button class="day-btn" onclick="switchDay('rA', 'day2', this)">DAY 2: UPPER (PUSH/PULL)</button>
                <button class="day-btn" onclick="switchDay('rA', 'day3', this)">DAY 3: LOWER (QUAD/BALANCE)</button>
                <button class="day-btn" onclick="switchDay('rA', 'day4', this)">DAY 4: UPPER (POSTURE/CORE)</button>
            </div>

            <div id="rA-day1" class="day-content active"></div>
            <div id="rA-day2" class="day-content"></div>
            <div id="rA-day3" class="day-content"></div>
            <div id="rA-day4" class="day-content"></div>
        </div>

        <div id="routineB" class="routine-content">
            <div class="day-nav">
                <button class="day-btn active" onclick="switchDay('rB', 'day1', this)">DAY 1: LOWER (GLUTE/HAM)</button>
                <button class="day-btn" onclick="switchDay('rB', 'day2', this)">DAY 2: UPPER (PUSH/PULL)</button>
                <button class="day-btn" onclick="switchDay('rB', 'day3', this)">DAY 3: LOWER (QUAD/BALANCE)</button>
                <button class="day-btn" onclick="switchDay('rB', 'day4', this)">DAY 4: UPPER (POSTURE/CORE)</button>
            </div>

            <div id="rB-day1" class="day-content active"></div>
            <div id="rB-day2" class="day-content"></div>
            <div id="rB-day3" class="day-content"></div>
            <div id="rB-day4" class="day-content"></div>
        </div>
    </main>

    <script src="workout-data.js"></script>

    <script>
        // Optional mapping object if you want to assign specific TikTok Video IDs to exercise names
        const exerciseTikTokMap = {
            "barbell_hip_thrust": "7693205556680592653",
            "dumbbell_rdls": "7623055040235801870",
            "bulgarian_split_squat": "7600801948383661325",
            "single_leg_cable_abductions": "7681500535626763527",
            "seated_leg_curl": "7617288943893007630",
            "standing_calf_raise": "7117045805822790917",

            "incline_db_press": "7622339714854522125",
            "seated_cable_row__neutral_grip_": "7487020129402899758",
            "cable_face_pulls": "7644677352546422030",
            "overhead_tricep_rope_extension": "7630114180758097166",
            "incline_db_bicep_curls": "7634582205070576910",
            "cable_pallof_press": "7634665864553401613",

            "leg_press__high___wide_stance_": "7483257684112821547",
            "walking_db_lunges": "7403389532386643242",
            "cable_glute_kickbacks": "7509130270444899630",
            "seated_abductor_machine": "7630843750666915093",
            "seated_calf_raise": "7105140508317453573",

            "chest_supported_db_row": "7540082178705722679",
            "high_incline_neutral_db_ohp": "7447951932745993518",
            "reverse_cable_flyes": "7564429106419338510",
            "db_hammer_curls": "7493322386155097386",
            "hanging_knee_raises": "7693796860795833630",
            "side_planks": "7485484681077460246"
        };

        function getTikTokEmbedHTML(exercise) {
            const key = exercise.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const videoId = exerciseTikTokMap[key];

            if (videoId) {
                return `
                    <blockquote class="tiktok-embed" cite="https://www.tiktok.com/video/${videoId}" data-video-id="${videoId}">
                        <section></section>
                    </blockquote>
                `;
            } else {
                // Generates a fallback direct search button/container if no video ID is explicitly configured
                const searchQuery = encodeURIComponent(exercise + " workout form");
                return `
                    <div class="tiktok-placeholder">
                        TikTok Form Video<br>
                        <a href="https://www.tiktok.com/search?q=${searchQuery}" target="_blank" rel="noopener noreferrer" style="color: var(--bunny-pink); text-decoration: underline; margin-top: 8px; display: inline-block;">
                            Search "${exercise}" on TikTok
                        </a>
                    </div>
                `;
            }
        }

        function parseAndRender() {
            if (!window.rawWorkoutCSV) {
                console.error("workout-data.js loaded, but window.rawWorkoutCSV is undefined.");
                return;
            }

            const lines = window.rawWorkoutCSV.split('\n');
            let currentRoutine = 'rA';

            lines.forEach(line => {
                if (line.includes('WEEK 1 & 2')) { currentRoutine = 'rA'; return; }
                if (line.includes('WEEK 3 & 4')) { currentRoutine = 'rB'; return; }

                const parts = line.split(',');
                if (parts.length < 6 || !parts[0] || parts[0].startsWith('Day,') || parts[0].trim() === '') return;

                const dayString = parts[0].trim();
                let dayNum = '';

                if (dayString.startsWith('Day 1')) dayNum = 'day1';
                else if (dayString.startsWith('Day 2')) dayNum = 'day2';
                else if (dayString.startsWith('Day 3')) dayNum = 'day3';
                else if (dayString.startsWith('Day 4')) dayNum = 'day4';

                const targetContainer = document.getElementById(`${currentRoutine}-${dayNum}`);

                if (targetContainer) {
                    const block = parts[1].trim();
                    const exercise = parts[2].trim();
                    const sets = parts[3].trim();
                    const reps = parts[4].trim();
                    const notes = parts[5].trim();

                    const isSpecialBlock = block.toLowerCase().includes('warm') || block.toLowerCase().includes('finish');
                    
                    let cardClass = 'exercise-card';
                    if (isSpecialBlock) {
                        cardClass += ' full-width';
                    }

                    const blockClass = isSpecialBlock ? 'block-tag warmup' : 'block-tag';

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.onclick = function(e) {
                        // Prevent collapse when clicking links inside the card
                        if (e.target.tagName === 'A') return;

                        this.classList.toggle('expanded');
                        
                        // Re-trigger TikTok embed script render upon expansion
                        if (this.classList.contains('expanded') && window.tiktokEmbed) {
                            window.tiktokEmbed.load();
                        }
                    };

                    card.innerHTML = `
                        <div class="exercise-info">
                            <span class="${blockClass}">${block}</span>
                            <div class="exercise-title">${exercise}</div>
                            <div class="exercise-meta">${sets} Sets × ${reps}</div>
                            <div class="exercise-notes">${notes}</div>
                        </div>
                        <div class="media-container">
                            ${getTikTokEmbedHTML(exercise)}
                        </div>
                    `;
                    targetContainer.appendChild(card);
                }
            });

            // Initial load trigger for TikTok Embed JS library
            if (window.tiktokEmbed) {
                window.tiktokEmbed.load();
            }
        }

        function switchRoutine(routineId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.routine-content').forEach(c => c.classList.remove('active'));

            btn.classList.add('active');
            document.getElementById(routineId).classList.add('active');
        }

        function switchDay(routinePrefix, dayId, btn) {
            const parent = document.getElementById(routinePrefix === 'rA' ? 'routineA' : 'routineB');
            parent.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            parent.querySelectorAll('.day-content').forEach(c => c.classList.remove('active'));

            btn.classList.add('active');
            document.getElementById(`${routinePrefix}-${dayId}`).classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', parseAndRender);
    </script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => console.log('Offline Service Worker Registered!', reg))
                .catch((err) => console.log('Service Worker Failed:', err));
        });
    }
</script>
</body>
</html>
